<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#fff4f8"/>
    <title>Loop — Handmade Crochet Shop</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <a class="brand" href="#home" aria-label="Crochet by Tina home">
            <span class="brand-mark">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="26" height="26">
                <circle cx="16" cy="16" r="11" fill="var(--primary-soft)"/>
                <path d="M7 12 Q16 7 25 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                      fill="none"/>
                <path d="M6 17 Q16 11 26 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                      fill="none"/>
                <path d="M7 22 Q16 17 25 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                      fill="none"/>
                <path d="M10 8 Q14 16 10 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                      fill="none"/>
                <path d="M16 5 Q20 16 16 27" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                      fill="none"/>
                <path d="M22 8 Q18 16 22 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                      fill="none"/>
              </svg>
            </span>
            <span>
          <strong>Loop</strong>
          <small>ruční tvorba s láskou</small>
        </span>
        </a>
        <nav class="main-nav" aria-label="Hlavní navigace">
            <a href="#shop">Produkty</a>
            <!--            <a href="#categories">Kategórie</a>-->
            <a href="#about">O mně</a>
        </nav>
        <div class="header-actions">
            <button class="icon-btn" data-action="toggle-theme" title="Přepnout motiv">☾</button>
            <button class="icon-btn" data-action="open-cart" title="Košík">
                👜<span class="badge" id="cart-count">0</span>
            </button>
            <button class="menu-btn" data-action="toggle-menu" aria-label="Menu">☰</button>
        </div>
    </header>

    <main id="app"></main>

    <footer class="footer">
        <div>
            <strong>Loop</strong>
            <span>© 2026 Crochet by Tina</span>
        </div>
        <div class="footer-social">
            <a href="https://www.instagram.com/loop.by.tina" target="_blank" rel="noopener" title="Instagram">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5"/>
                    <circle cx="12" cy="12" r="5"/>
                    <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/>
                </svg>
                Instagram
            </a>
            <a href="https://www.tiktok.com/@crochet.by.t1na" target="_blank" rel="noopener" title="TikTok">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.28 6.28 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/>
                </svg>
                TikTok
            </a>
            <a href="https://linktr.ee/crochetbytina" target="_blank" rel="noopener" title="Linktree">🔗 Linktree</a>
        </div>
        <div class="footer-note">Všechny výrobky jsou handmade • termín výroby se počítá podle aktuální vytíženosti.
        </div>
    </footer>
</div>

<aside class="drawer" id="cart-drawer" aria-hidden="true">
    <div class="drawer-head">
        <div>
            <span class="eyebrow">Tvůj výběr</span>
            <h2>Košík</h2>
        </div>
        <button class="close-btn" data-action="close-cart">×</button>
    </div>
    <div class="drawer-body" id="cart-content"></div>
    <div class="drawer-foot" id="cart-footer"></div>
</aside>
<div class="drawer-backdrop" id="drawer-backdrop"></div>

<script src="app.js"></script>
</body>
</html>
